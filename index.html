<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Controle · Defin Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#0b1420;--ink-soft:#5c6478;
  --cyan:#14b8c7;--cyan-deep:#0a7c89;--cyan-soft:#e3f8fa;
  --bg:#eef1f6;--surface:#fff;--surface2:#e8edf3;--border:#dde3ec;
  --ok:#14b8c7;--pending:#ee9c2e;
  --ig-1:#f58529;--ig-2:#dd2a7b;--ig-3:#8134af;--ig-4:#515bd4;
  --fb:#1877f2;--fb-deep:#0e5bc4;
  --li:#0a66c2;--li-deep:#07437f;
  --radius:14px;--radius-lg:20px;--radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(11,20,32,.06);
  --shadow-md:0 6px 20px rgba(11,20,32,.09),0 1px 3px rgba(11,20,32,.06);
  --shadow-lg:0 16px 36px rgba(11,20,32,.14),0 3px 10px rgba(11,20,32,.08);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 520px at 12% -10%, rgba(20,184,199,.10), transparent 55%),
    radial-gradient(800px 440px at 100% 0%, rgba(81,91,212,.07), transparent 55%),
    var(--bg);
  background-attachment:fixed}
h1,h2,h3,.topbar-brand{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit}
.loading-screen{height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.login-screen{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:
    radial-gradient(900px 480px at 18% -8%, rgba(20,184,199,.38), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(81,91,212,.22), transparent 55%),
    linear-gradient(160deg,#0b1420 0%,#111d2b 55%,#0b1420 100%)}
.login-card{position:relative;background:var(--surface);border-radius:var(--radius-lg);padding:40px 36px;width:340px;box-shadow:0 30px 70px rgba(0,0,0,.45);border-top:4px solid var(--cyan)}
.login-logo{margin-bottom:18px}
.login-logo img{height:40px;display:block}
.topbar-brand img{height:28px;display:block}
.login-card h1{font-size:23px;margin:0 0 4px}
.login-sub{color:var(--ink-soft);font-size:13px;margin-bottom:24px}
.login-card label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.login-card input{width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:14px;transition:border-color .15s}
.login-card input:focus{outline:none;border-color:var(--cyan)}
.login-card button[type="submit"]{width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;transition:transform .12s,background .15s}
.login-card button[type="submit"]:hover{background:var(--cyan-deep)}
.login-card button[type="submit"]:active{transform:scale(.98)}
.login-error{color:#dc2626;font-size:13px;margin-bottom:10px}
.link-btn{display:block;background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:13px;cursor:pointer;padding:6px 0;margin-top:10px}
.link-btn:hover{color:var(--cyan-deep)}
.shell{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.topbar-logo img{height:30px;display:block}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}
.topbar-client{font-weight:600;color:var(--ink-soft)}
.topbar-spacer{flex:1}
.topbar select{padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink)}
.back-btn{background:none;border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink-soft);font-size:13px;font-weight:500;transition:border-color .15s,color .15s}
.back-btn:hover{border-color:var(--cyan);color:var(--cyan-deep)}
.logout-btn{background:none;border:1px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink-soft);font-size:13px;font-weight:500;transition:border-color .15s,color .15s}
.logout-btn:hover{border-color:var(--ink);color:var(--ink)}
.client-links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.client-links a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:999px;font-size:13px;color:var(--ink);font-weight:500;transition:border-color .15s,transform .12s}
.client-links a:hover{border-color:var(--cyan);transform:translateY(-1px)}
.client-links a svg{width:15px;height:15px;flex-shrink:0}
.month-switch,.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.month-switch button,.tabs button{border:1px solid var(--border);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-soft);font-weight:500;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.month-switch button:hover,.tabs button:hover{border-color:var(--cyan)}
.month-switch button.active,.tabs button.active{background:linear-gradient(135deg,var(--ink),#16222f);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}
.add-btn{border:1px dashed var(--cyan) !important;color:var(--cyan-deep) !important;background:none;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.panel h3{margin:0 0 12px;font-size:17px}
.panel-sub{color:var(--ink-soft);font-size:13px;margin:0 0 12px}
.panel textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;resize:vertical}
.panel textarea:focus,.panel input:focus{outline:none;border-color:var(--cyan)}
.panel button.save{margin-top:10px;padding:10px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(20,184,199,.3);transition:box-shadow .15s,transform .12s}
.panel button.save:hover{box-shadow:0 6px 18px rgba(20,184,199,.4);transform:translateY(-1px)}
.panel button.save:active{transform:scale(.98)}
.admin-summary-text{white-space:pre-wrap;line-height:1.6}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s}
.metric-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}

/* ---- Hub de clientes (tela central do admin) ---- */
.hub-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px}
.hub-head h2{margin:0;font-size:24px;font-family:'Space Grotesk',sans-serif}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
.client-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--cyan)}
.client-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.client-card-avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif;flex-shrink:0;overflow:hidden}
.client-card-avatar img{width:100%;height:100%;object-fit:cover}
.client-card-name{font-weight:700;font-size:15px}
.client-card-area{color:var(--ink-soft);font-size:12px;margin-top:2px}
.client-card-status{display:inline-block;font-size:11px;font-weight:600;color:var(--cyan-deep);background:var(--cyan-soft);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.client-card-services{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.svc-tag{font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--ink-soft);padding:3px 9px;border-radius:999px}
.client-card-cycle{font-size:12px;color:var(--ink-soft)}
.metric-label{font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.metric-value{font-size:25px;font-weight:700;font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
.metric-value span{font-size:14px;color:var(--ink-soft);font-weight:500}
.progress-bar-outer{height:8px;background:var(--border);border-radius:999px;margin-top:10px;overflow:hidden}
.progress-bar-outer.small{height:5px;margin-top:8px}
.progress-bar-inner{height:100%;background:var(--cyan);border-radius:999px}
.status-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.status-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:13px}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--pending)}
.status-pill.ok .dot{background:var(--ok)}
.status-pill.ok{color:var(--ok)}
.calendar-list{display:flex;flex-direction:column;gap:8px}
.calendar-row{display:grid;grid-template-columns:110px 100px 90px 1fr 100px;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:13px}
.calendar-row.editable{grid-template-columns:140px 120px 110px 1fr 120px}
.calendar-row input,.calendar-row select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:13px;background:var(--surface)}
.calendar-status{padding:4px 10px;border-radius:999px;text-align:center;font-size:12px}
.status-planejado{background:#fbe8cc;color:#9a5a12}
.cal-grid{margin-bottom:18px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-weekdays div{text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:76px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-cell.cal-empty{background:transparent;border-color:transparent}
.cal-cell.cal-today{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.cal-daynum{font-size:11px;font-weight:700;color:var(--ink-soft)}
.cal-chip{display:flex;align-items:center;gap:4px;font-size:10px;line-height:1.3;padding:3px 6px;border-radius:6px;color:#fff;overflow:hidden;white-space:nowrap}
.cal-chip svg{width:10px;height:10px;flex-shrink:0}
.cal-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-chip.cal-instagram{background:linear-gradient(135deg,var(--ig-2),var(--ig-4))}
.cal-chip.cal-facebook{background:var(--fb)}
.cal-chip.cal-linkedin{background:var(--li)}
.cal-chip.cal-tiktok{background:#111}
.cal-chip.cal-site{background:var(--ink-soft)}
.cal-chip.cal-planejado{opacity:.62}
@media (max-width:760px){.cal-cell{min-height:52px;padding:4px}.cal-chip span{display:none}.cal-chip{justify-content:center;padding:4px}}
.status-publicado{background:var(--cyan-soft);color:var(--cyan-deep)}
.checklist-list{display:flex;flex-direction:column;gap:6px}
.checklist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:13px}
.checklist-row.clickable{cursor:pointer}
.checklist-row.done{opacity:.6;text-decoration:line-through}
.checklist-check{color:var(--cyan-deep);font-weight:700}
.checklist-row.editable-row{gap:8px}
.checklist-check.clickable{cursor:pointer;user-select:none;flex-shrink:0}
.checklist-edit-input{flex:1;border:1px solid transparent;background:transparent;font-size:13px;font-family:inherit;color:var(--ink);padding:4px 6px;border-radius:6px}
.checklist-edit-input:hover,.checklist-edit-input:focus{border-color:var(--border);background:var(--surface);outline:none}
.checklist-row.done .checklist-edit-input{text-decoration:line-through;opacity:.6}
.checklist-del-btn{border:none;background:none;cursor:pointer;opacity:.5;font-size:14px;flex-shrink:0;padding:2px 4px}
.checklist-del-btn:hover{opacity:1}
.admin-field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.field-label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.field-label input,.field-label textarea{width:100%;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:14px;font-family:inherit}
.check-field{display:flex;align-items:center;gap:8px;font-size:13px}
.empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px}
.process-banner{position:relative;overflow:hidden;display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;
  background:
    radial-gradient(640px 320px at 92% -30%, rgba(20,184,199,.45), transparent 60%),
    radial-gradient(420px 260px at 0% 120%, rgba(81,91,212,.28), transparent 60%),
    linear-gradient(135deg,#0b1420,#16222f);
  color:#fff;border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:18px}
.process-banner .process-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px}
.process-banner .process-sub{color:#a9e4ea;font-size:13px}
.process-banner .process-week-desc{flex-basis:100%;color:#cbd5e1;font-size:13px;line-height:1.5}
.process-select-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.process-select-row label{font-size:12px;color:var(--ink-soft)}
.process-select-row select{display:block;margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:14px;background:var(--surface)}
.week-desc-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink-soft);margin-top:10px;max-width:460px}
.sync-panel{border:1px dashed var(--cyan-deep);background:linear-gradient(180deg,var(--cyan-soft),var(--surface) 70%)}
.sync-btn{background:var(--ink) !important;margin-left:8px}
.sync-btn:hover{background:#000 !important}
.sync-btn:disabled{opacity:.6;cursor:default}
.frozen-note{color:#9a5a12;background:#fbe8cc;padding:8px 12px;border-radius:8px;display:inline-block}
.client-logo-chip{width:22px;height:22px;border-radius:7px;object-fit:cover;margin-right:8px;vertical-align:middle;border:1px solid rgba(255,255,255,.4)}
.danger-zone{border:1px dashed #d64545;background:#fdf1f1}
.danger-zone h3{color:#b02a2a}
.danger-btn{background:#d64545 !important}
.danger-btn:hover{background:#b02a2a !important}
.confirm-overlay{position:fixed;inset:0;background:rgba(11,20,32,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.confirm-card{background:var(--surface);border-radius:var(--radius-lg);padding:28px;max-width:420px;width:100%;box-shadow:var(--shadow-lg)}
.confirm-card h2{margin:0 0 10px;font-size:19px;font-family:'Space Grotesk',sans-serif;color:#b02a2a}
.confirm-card p{color:var(--ink-soft);font-size:14px;line-height:1.5}
.confirm-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin:10px 0}
.confirm-card-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.confirm-cancel-btn{background:var(--surface2);color:var(--ink);border:1px solid var(--border);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600}
.logo-upload-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-preview{width:56px;height:56px;border-radius:14px;object-fit:cover;border:1px solid var(--border);background:var(--surface2)}
.sync-badge{display:inline-block;margin-left:10px;font-size:11px;font-weight:600;color:var(--cyan-deep);background:var(--cyan-soft);padding:2px 8px;border-radius:999px;vertical-align:middle}

/* ---- cartões de rede social (cada rede com identidade própria) ---- */
.network-head{display:flex;align-items:center;gap:10px;margin:-20px -22px 16px;padding:14px 22px;border-radius:var(--radius) var(--radius) 0 0;color:#fff}
.network-head h3{margin:0;color:#fff;font-size:16px}
.network-head svg{width:20px;height:20px;flex-shrink:0}
.network-head.n-instagram{background:linear-gradient(135deg,var(--ig-1),var(--ig-2) 45%,var(--ig-3) 70%,var(--ig-4))}
.network-head.n-facebook{background:linear-gradient(135deg,var(--fb),var(--fb-deep))}
.network-head.n-linkedin{background:linear-gradient(135deg,var(--li),var(--li-deep))}
.panel.network-card{padding-top:0;overflow:hidden}
.panel.network-card .metric-card{border-top-width:3px}
.panel.network-card.c-instagram .metric-card{border-top-color:var(--ig-2)}
.panel.network-card.c-facebook .metric-card{border-top-color:var(--fb)}
.panel.network-card.c-linkedin .metric-card{border-top-color:var(--li)}

.welcome-overlay{position:fixed;inset:0;background:rgba(11,20,32,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:welcomeFade .2s ease-out}
.welcome-card{background:var(--surface);border-radius:var(--radius-lg);padding:36px 32px;max-width:380px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35);border-top:4px solid var(--cyan);animation:welcomePop .25s ease-out}
.welcome-card img{height:36px;margin-bottom:18px}
.welcome-card h2{margin:0 0 10px;font-size:22px}
.welcome-card p{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0 0 22px}
.welcome-card button{border:none;background:var(--cyan);color:#fff;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;transition:background .15s,transform .12s}
.welcome-card button:hover{background:var(--cyan-deep)}
.welcome-card button:active{transform:scale(.98)}
@keyframes welcomeFade{from{opacity:0}to{opacity:1}}
@keyframes welcomePop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media (max-width:720px){.metric-grid,.admin-field-grid{grid-template-columns:repeat(2,1fr)}.calendar-row,.calendar-row.editable{grid-template-columns:1fr}.network-head{margin:-20px -16px 16px;padding:14px 16px}}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Carregando...</div></div>

<script>
// ======================================================
// 1) CONFIGURAÇÃO — troque pelos dados do SEU projeto Supabase
// ======================================================
const SUPABASE_URL = "https://ahgcsxmzrspodeqmdxex.supabase.co";

// Grade visual do mês (calendário), usada tanto no painel do admin quanto no do cliente.
// Reaproveita os mesmos registros de "calendar_posts" já cadastrados em Entregáveis/Calendário.
function monthCalendarGridHtml(monthLabel, posts){
  const [y, mo] = (monthLabel || "").split("-").map(Number);
  if (!y || !mo) return "";
  const firstDay = new Date(Date.UTC(y, mo - 1, 1));
  const daysInMonth = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const startWeekday = firstDay.getUTCDay();

  const byDay = {};
  (posts || []).forEach(p => {
    if (!p.post_date || p.post_date.slice(0, 7) !== monthLabel) return;
    const day = parseInt(p.post_date.slice(8, 10), 10);
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(p);
  });

  const todayStr = new Date().toISOString().slice(0, 10);
  const weekdays = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++){
    const dayStr = `${monthLabel}-${String(day).padStart(2, "0")}`;
    const dayPosts = byDay[day] || [];
    const chips = dayPosts.map(p => {
      const chLabel = CHANNEL_LABEL[p.channel] || p.channel || "";
      const text = (p.title || TYPE_LABEL[p.type] || chLabel || "").trim();
      const titleAttr = `${chLabel}${p.title ? " — " + p.title : ""}`.replace(/"/g, "&quot;");
      return `<div class="cal-chip cal-${p.channel || "site"} cal-${p.status || "planejado"}" title="${titleAttr}">${networkIcon(p.channel)}<span>${text}</span></div>`;
    }).join("");
    cells += `<div class="cal-cell${dayStr === todayStr ? " cal-today" : ""}"><div class="cal-daynum">${day}</div>${chips}</div>`;
  }
  const totalCells = startWeekday + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell cal-empty"></div>`;

  return `<div class="cal-grid">
    <div class="cal-weekdays">${weekdays.map(w => `<div>${w}</div>`).join("")}</div>
    <div class="cal-days">${cells}</div>
  </div>`;
}
// Período de referência do ciclo de trabalho: sempre do dia 23 do mês
// anterior até o dia 23 do próprio mês (ex: mês "2026-10" = 23/09 a 23/10).
function monthPeriodRange(monthLabel, cycleStartDay){
  const day = cycleStartDay || 23;
  const [y, m] = monthLabel.split("-").map(Number);
  let py = y, pm = m - 1;
  if (pm === 0){ pm = 12; py = y - 1; }
  const start = new Date(Date.UTC(py, pm - 1, day));
  const end = new Date(Date.UTC(y, m - 1, day));
  return { start, end };
}
function fmtDatePt(d){ return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric", timeZone:"UTC" }); }
function periodRangeLabel(monthLabel, cycleStartDay){
  const { start, end } = monthPeriodRange(monthLabel, cycleStartDay);
  return `${fmtDatePt(start)} a ${fmtDatePt(end)}`;
}
// Um mês fica "encerrado" assim que a data de hoje passa do fim do período
// de referência dele (dia do ciclo). A partir daí, os números de seguidores
// desse mês ficam congelados — a Meta só entrega o total ATUAL de seguidores,
// então sincronizar um mês já encerrado sobrescreveria o histórico com o
// número de hoje, que já pertence ao próximo ciclo.
function isMonthClosed(monthLabel, cycleStartDay){
  const { end } = monthPeriodRange(monthLabel, cycleStartDay);
  const now = new Date();
  const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
  return todayUTC > end;
}
// Além do fim do ciclo pela data, o admin pode travar o mês na hora —
// assim que clica em "Gerar PDF", os números viram definitivos e a
// sincronização automática para de poder sobrescrevê-los.
function isSyncLocked(month, cycleStartDay){
  if (!month) return false;
  return isMonthClosed(month.month_label, cycleStartDay) || !!month.report_locked;
}

async function init(){

async function loadProfile(){

  if (data && data.role === "admin") await loadClients();
  if (data && data.role === "client") await loadClientData(data.client_id);

}

    if (typed !== client.name){ errEl.textContent = "O nome digitado não confere."; return; }
    const btn = document.getElementById("deleteConfirmBtn");
    btn.disabled = true; btn.textContent = "Excluindo…";
    try {
      const { data: sessionData } = await sb.auth.getSession();
      const { data, error } = await sb.functions.invoke("delete-client", {
        body: { client_id: client.id },
        headers: { Authorization: `Bearer ${sessionData.session.access_token}` }
      });
      if (error) throw error;
      if (data && data.error) throw new Error(data.error);
      state.clients = state.clients.filter(c => c.id !== client.id);
      if (state.selectedClientId === client.id){
        state.selectedClientId = state.clients.length ? state.clients[0].id : null;
        state.adminView = "hub"; state.hubTab = "lista";
      }
      close();
      render();
    } catch (e) {
      errEl.textContent = "Erro ao excluir: " + (e.message || e);
      btn.disabled = false; btn.textContent = "Excluir definitivamente";
    }
  };
}

function bindProposalHandlers(){
  const saveProposalBtn = document.getElementById("saveProposalBtn");
  if (saveProposalBtn) saveProposalBtn.onclick = async () => {
    await ensureProposal(state.selectedClientId);
    const payload = { objetivo: document.querySelector('[data-proposal="objetivo"]').value,
                       observacao_metricas: document.querySelector('[data-proposal="observacao_metricas"]').value };
    PROPOSAL_LISTS.forEach(([field]) => {
      const raw = document.querySelector(`[data-proposal="${field}"]`).value;
      payload[field] = raw.split("\n").map(s=>s.trim()).filter(Boolean);
    });
    const { data, error } = await sb.from("proposals").update(payload).eq("client_id", state.selectedClientId).select().single();
    if (!error) { state.proposal = data; saveProposalBtn.textContent = "Salvo!"; setTimeout(()=>saveProposalBtn.textContent="Salvar proposta", 1500); }
    else alert("Erro ao salvar proposta: " + error.message);
  };
  const saveBillingBtn = document.getElementById("saveBillingBtn");
  if (saveBillingBtn) saveBillingBtn.onclick = async () => {
    await ensureBilling(state.selectedClientId);
    const payload = { monthly_value: Number(document.querySelector('[data-billing="monthly_value"]').value),
                       note: document.querySelector('[data-billing="note"]').value };
    const { data, error } = await sb.from("client_billing").update(payload).eq("client_id", state.selectedClientId).select().single();
    if (!error) { state.billing = data; saveBillingBtn.textContent = "Salvo!"; setTimeout(()=>saveBillingBtn.textContent="Salvar valor", 1500); }
    else alert("Erro ao salvar valor: " + error.message);
  };
  const uploadPdfBtn = document.getElementById("uploadProposalPdfBtn");
  if (uploadPdfBtn) uploadPdfBtn.onclick = async () => {
    const input = document.getElementById("proposalPdfInput");
    const file = input.files[0];
    const statusEl = document.getElementById("proposalPdfStatus");
    if (!file){ if (statusEl) statusEl.textContent = "Escolha um arquivo PDF primeiro."; return; }
    await ensureProposal(state.selectedClientId);
    const path = `${state.selectedClientId}/planejamento.pdf`;
    if (statusEl) statusEl.textContent = "Enviando…";
    const { error: upErr } = await sb.storage.from("proposals").upload(path, file, { upsert: true, contentType: "application/pdf" });
    if (upErr){ if (statusEl) statusEl.textContent = "Erro ao enviar: " + upErr.message; return; }
    const { data, error } = await sb.from("proposals").update({ pdf_path: path }).eq("client_id", state.selectedClientId).select().single();
    if (!error) state.proposal = data;
    if (statusEl) statusEl.textContent = "PDF enviado! Já aparece pro cliente.";
    renderAdmin();
  };
  document.querySelectorAll("#downloadProposalPdfBtn").forEach(btn => {
    btn.onclick = async () => {
      const path = state.proposal && state.proposal.pdf_path;
      if (!path) return;
      const { data, error } = await sb.storage.from("proposals").createSignedUrl(path, 60);
      if (error){ alert("Erro ao gerar link de download: " + error.message); return; }
      window.open(data.signedUrl, "_blank");
    };
  });
}

function bindAdminHandlers(){
  document.querySelectorAll("[data-field]").forEach(el => {
    if (el.closest(".calendar-row") || el.dataset.social) return;
    el.onchange = async () => {
      const field = el.dataset.field;
      const value = el.type === "checkbox" ? el.checked : (el.type === "number" ? Number(el.value) : el.value);
      state.selectedMonth[field] = value;
      await sb.from("deliverable_months").update({ [field]: value }).eq("id", state.selectedMonth.id);
    };
  });
  document.querySelectorAll("[data-social]").forEach(el => {
    el.onchange = async () => {
      const platform = el.dataset.social, field = el.dataset.field;
      const value = field === "note" ? el.value : Number(el.value);
      state.socialInsights[platform][field] = value;
      await sb.from("social_insights").update({ [field]: value }).eq("id", state.socialInsights[platform].id);
    };
  });
  document.querySelectorAll("[data-post]").forEach(el => {
    el.onchange = async () => {
      const id = el.dataset.post, field = el.dataset.field, value = el.value;
      await sb.from("calendar_posts").update({ [field]: value }).eq("id", id);
      const post = state.calendarPosts.find(p => p.id === id);
      if (post) post[field] = value;
    };
  });
  const saveMetaIdsBtn = document.getElementById("saveMetaIdsBtn");
  if (saveMetaIdsBtn){
    saveMetaIdsBtn.onclick = async () => {
      const clientId = state.selectedClientId;
      const fb_page_id = document.getElementById("fbPageIdInput").value.trim() || null;
      const ig_business_id = document.getElementById("igBizIdInput").value.trim() || null;
      const { error } = await sb.from("clients").update({ fb_page_id, ig_business_id }).eq("id", clientId);
      if (error){ alert("Erro ao salvar: " + error.message); return; }
      const client = state.clients.find(c => c.id === clientId);
      if (client){ client.fb_page_id = fb_page_id; client.ig_business_id = ig_business_id; }
      renderAdmin();
    };
  }
  const syncMetaBtn = document.getElementById("syncMetaBtn");
  if (syncMetaBtn){
    syncMetaBtn.onclick = async () => {
      const statusEl = document.getElementById("syncStatus");
      syncMetaBtn.disabled = true;
      syncMetaBtn.textContent = "Sincronizando…";
      if (statusEl) statusEl.textContent = "Buscando dados na Meta…";
      try {
        const { data: sessionData } = await sb.auth.getSession();
        const { data, error } = await sb.functions.invoke("sync-meta-insights", {
          body: { client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id },
          headers: { Authorization: `Bearer ${sessionData.session.access_token}` }
        });
        if (error) throw error;
        if (data && data.error) throw new Error(data.error);
        await loadSocialInsights(state.selectedMonth.id);
        const errs = (data && data.errors) || [];
        if (statusEl){
          statusEl.textContent = errs.length
            ? "Sincronizado com avisos: " + errs.join(" · ")
            : "Sincronizado agora — " + new Date().toLocaleString("pt-BR");
        }
        renderAdmin();
      } catch (e) {
        if (statusEl) statusEl.textContent = "Erro ao sincronizar: " + (e.message || e);
        syncMetaBtn.disabled = false;
        syncMetaBtn.textContent = "🔄 Sincronizar agora";
      }
    };
  }
  const saveMetaAdsBtn = document.getElementById("saveMetaAdsBtn");
  if (saveMetaAdsBtn) saveMetaAdsBtn.onclick = async () => {
    const payload = { client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id };
    document.querySelectorAll("[data-metaads]").forEach(el => {
      const f = el.dataset.metaads;
      payload[f] = f === "note" ? el.value : Number(el.value);
    });
    const { data, error } = await sb.from("meta_ads_data").upsert(payload, { onConflict: "deliverable_month_id" }).select().single();
    if (!error) { state.metaAdsData = data; saveMetaAdsBtn.textContent = "Salvo!"; setTimeout(()=>saveMetaAdsBtn.textContent="Salvar", 1500); }
    else alert("Erro ao salvar Meta Ads: " + error.message);

  const saveGmnBtn = document.getElementById("saveGmnBtn");
  if (saveGmnBtn) saveGmnBtn.onclick = async () => {
    const payload = { client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id };

      const f = el.dataset.gmn;
      payload[f] = f === "note" ? el.value : Number(el.value);

    if (!error) { state.gmnData = data; saveGmnBtn.textContent = "Salvo!"; setTimeout(()=>saveGmnBtn.textContent="Salvar", 1500); }

        const logo_url = pub.publicUrl + "?v=" + Date.now();
        const { error } = await sb.from("clients").update({ logo_url }).eq("id", state.selectedClientId);
        if (error) throw error;
        const client = state.clients.find(c => c.id === state.selectedClientId);
        if (client) client.logo_url = logo_url;
        if (statusEl) statusEl.textContent = "Logo atualizada!";

      uploadClientSiteShotBtn.disabled = true;
      uploadClientSiteShotBtn.textContent = "Enviando…";
      try {
        const ext = (file.name.split(".").pop() || "png").toLowerCase();
        const path = `${state.selectedClientId}/site-screenshot.${ext}`;
        const { error: upErr } = await sb.storage.from("client-logos").upload(path, file, { upsert: true, contentType: file.type });
        if (upErr) throw upErr;
        const { data: pub } = sb.storage.from("client-logos").getPublicUrl(path);
        const site_screenshot_url = pub.publicUrl + "?v=" + Date.now();
        const { error } = await sb.from("clients").update({ site_screenshot_url }).eq("id", state.selectedClientId);
        if (error) throw error;
        const client = state.clients.find(c => c.id === state.selectedClientId);
        if (client) client.site_screenshot_url = site_screenshot_url;
        if (statusEl) statusEl.textContent = "Print salvo!";
        renderAdmin();
      } catch (e) {
        if (statusEl) statusEl.textContent = "Erro ao enviar: " + (e.message || e);
        uploadClientSiteShotBtn.disabled = false;
        uploadClientSiteShotBtn.textContent = "Salvar print";
      }
    };
  }
  const deleteClientBtn = document.getElementById("deleteClientBtn");
  if (deleteClientBtn){

      if (client) showDeleteClientModal(client);

        extractLinkedinBtn.textContent = "Lendo com IA…";

// Agrupa o handler de "cadastrar cliente" (usado no Hub) com o restante
// dos handlers da área de trabalho do admin (usado na tela do cliente).
// Cada handler só age se o elemento dele existir na tela atual, então é
// seguro chamar essa função tanto do Hub quanto da área de trabalho.
function bindAdminTailHandlers(){
  const createClientBtn = document.getElementById("createClientBtn");
  if (createClientBtn) createClientBtn.onclick = async () => {
    const statusEl = document.getElementById("newClientStatus");
    const name = document.getElementById("newClientName").value.trim();
    const area_atuacao = document.getElementById("newClientArea").value.trim() || null;
    const site_url = document.getElementById("newClientSite").value.trim() || null;
    const instagram_url = document.getElementById("newClientInstagram").value.trim() || null;
    const facebook_url = document.getElementById("newClientFacebook").value.trim() || null;
    const linkedin_url = document.getElementById("newClientLinkedin").value.trim() || null;
    const cycleDayRaw = document.getElementById("newClientCycleDay").value.trim();
    const cycle_start_day = cycleDayRaw ? parseInt(cycleDayRaw, 10) : 23;
    const monthly_fee = parseFloat(document.getElementById("newClientFee").value) || 0;
    const services = [];
    if (document.getElementById("svcRedes").checked) services.push("redes_sociais");
    if (document.getElementById("svcMetaAds").checked) services.push("meta_ads");
    if (document.getElementById("svcGmn").checked) services.push("gmn");
    const email = document.getElementById("newClientEmail").value.trim();
    const password = document.getElementById("newClientPassword").value;

    if (!name){ alert("Preenche o nome do cliente."); return; }
    if (cycle_start_day < 1 || cycle_start_day > 28){ alert("O dia de início do ciclo precisa ser entre 1 e 28."); return; }
    if (email && password && password.length < 6){ alert("A senha precisa ter pelo menos 6 caracteres."); return; }
    if (email && !password){ alert("Preenche a senha pra criar o login, ou deixa os dois (e-mail e senha) em branco."); return; }

    createClientBtn.disabled = true;
    createClientBtn.textContent = "Cadastrando…";
    if (statusEl) statusEl.textContent = "Criando cliente…";

    try {
      const { data: newClient, error: clientErr } = await sb.from("clients").insert({
        name, area_atuacao, site_url, instagram_url, facebook_url, linkedin_url,
        cycle_start_day, monthly_fee, services
      }).select().single();
      if (clientErr) throw clientErr;

      const logoFile = document.getElementById("newClientLogo").files[0];
      if (logoFile){
        if (statusEl) statusEl.textContent = "Cliente criado. Enviando logo…";
        const ext = (logoFile.name.split(".").pop() || "png").toLowerCase();
        const path = `${newClient.id}/logo.${ext}`;
        const { error: logoErr } = await sb.storage.from("client-logos").upload(path, logoFile, { upsert: true, contentType: logoFile.type });
        if (!logoErr){
          const { data: pub } = sb.storage.from("client-logos").getPublicUrl(path);
          const logo_url = pub.publicUrl + "?v=" + Date.now();
          await sb.from("clients").update({ logo_url }).eq("id", newClient.id);
          newClient.logo_url = logo_url;
        }
      }

      if (email && password){
        if (statusEl) statusEl.textContent = "Cliente criado. Criando login…";
        const { data: sessionData } = await sb.auth.getSession();
        const { data, error } = await sb.functions.invoke("create-client-login", {
          body: { client_id: newClient.id, email, password, full_name: name },
          headers: { Authorization: `Bearer ${sessionData.session.access_token}` }
        });
        if (error) throw error;
        if (data && data.error) throw new Error(data.error);
      }

      state.clients.push(newClient);
      state.clients.sort((a,b) => a.name.localeCompare(b.name));
      state.selectedClientId = newClient.id;
      await loadMonthsFor(newClient.id, true);
      state.adminView = "workspace";
      state.adminTab = "entregaveis";
      render();
    } catch (e) {
      if (statusEl) statusEl.textContent = "Erro: " + (e.message || e);
      createClientBtn.disabled = false;
      createClientBtn.textContent = "Cadastrar cliente";
    }
  };
  const addMonthBtn = document.getElementById("addMonthBtn");
  if (addMonthBtn) addMonthBtn.onclick = async () => {
    let label = prompt("Mês (formato AAAA-MM, ex: 2026-11):");
    if (!label) return;
    label = label.trim();
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(label)){
      alert("Formato inválido. Use exatamente AAAA-MM (ano, traço, mês com 2 dígitos), por exemplo: 2026-11");
      return;
    }
    const { data, error } = await sb.from("deliverable_months").insert({
      client_id: state.selectedClientId, month_label: label,
      posts_target:26, stories_target:78, linkedin_target:60, reels_target:0
    }).select().single();
    if (!error){
      state.months.push(data); state.selectedMonth = data; state.calendarPosts=[]; state.socialInsights={};
      state.checklist = []; state.monthlyReport = null; state.metaAdsData = null; state.gmnData = null;
      await ensureSocialInsightRows(data.id, state.selectedClientId);
      await loadPreviousMonthData(state.selectedClientId, data);
      renderAdmin();
    } else alert("Erro ao criar mês: " + error.message);
  };
  const addChecklistBtn = document.getElementById("addChecklistBtn");
  if (addChecklistBtn) addChecklistBtn.onclick = async () => {
    const title = prompt("O que foi feito / adicionado neste mês?");
    if (!title) return;
    const { data, error } = await sb.from("checklist_items").insert({
      client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id,
      topic: "geral", title, sort_order: state.checklist.length
    }).select().single();
    if (!error){ state.checklist.push(data); renderAdmin(); }
    else alert("Erro ao criar item: " + error.message);
  };
  const addPostBtn = document.getElementById("addPostBtn");
  if (addPostBtn) addPostBtn.onclick = async () => {
    const title = prompt("Título/descrição da publicação:");
    if (!title) return;
    const date = prompt("Data (AAAA-MM-DD):");
    if (!date) return;
    const { data, error } = await sb.from("calendar_posts").insert({
      client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id,
      post_date: date, channel:"instagram", type:"post", title, status:"planejado"
    }).select().single();
    if (!error){ state.calendarPosts.push(data); renderAdmin(); }
    else alert("Erro ao criar publicação: " + error.message);
  };
  const saveSummaryBtn = document.getElementById("saveSummaryBtn");
  if (saveSummaryBtn) saveSummaryBtn.onclick = async () => {
    const text = document.getElementById("summaryBox").value;
    await sb.from("deliverable_months").update({ admin_summary:text }).eq("id", state.selectedMonth.id);
    state.selectedMonth.admin_summary = text;
    saveSummaryBtn.textContent = "Salvo!"; setTimeout(()=>saveSummaryBtn.textContent="Salvar resumo", 1500);
  };
  const saveReportBtn = document.getElementById("saveReportBtn");
  if (saveReportBtn) saveReportBtn.onclick = async () => {
    const payload = { client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id, proximo_mes: document.querySelector('[data-report="proximo_mes"]').value };
    REPORT_SECTIONS.forEach(([field]) => {
      payload[field] = document.querySelector(`[data-report="${field}"]`).value;
    });
    const { data, error } = await sb.from("monthly_reports")
      .upsert(payload, { onConflict: "deliverable_month_id" }).select().single();
    if (!error) { state.monthlyReport = data; saveReportBtn.textContent = "Salvo!"; setTimeout(()=>saveReportBtn.textContent="Salvar", 1500); }
    else alert("Erro ao salvar relatório: " + error.message);
  };
  const generateReportPdfBtn = document.getElementById("generateReportPdfBtn");
  if (generateReportPdfBtn) generateReportPdfBtn.onclick = async () => {
    const payload = { client_id: state.selectedClientId, deliverable_month_id: state.selectedMonth.id, proximo_mes: document.querySelector('[data-report="proximo_mes"]').value };
    REPORT_SECTIONS.forEach(([field]) => {
      payload[field] = document.querySelector(`[data-report="${field}"]`).value;
    });
    const { data, error } = await sb.from("monthly_reports")
      .upsert(payload, { onConflict: "deliverable_month_id" }).select().single();
    if (error) { alert("Erro ao salvar antes de gerar o PDF: " + error.message); return; }
    state.monthlyReport = data;
    const client = state.clients.find(c => c.id === state.selectedClientId);
    generateReportPdfBtn.disabled = true;
    generateReportPdfBtn.textContent = "Gerando…";
    try {
      await generateReportPdf(client, state.selectedMonth, data);
      // Trava o mês: a partir daqui os números deste ciclo são definitivos
      // e a sincronização automática para de poder sobrescrevê-los.
      if (!state.selectedMonth.report_locked){
        await sb.from("deliverable_months").update({ report_locked: true, relatorio_done: true }).eq("id", state.selectedMonth.id);
        state.selectedMonth.report_locked = true;
        state.selectedMonth.relatorio_done = true;
      }
    } finally {
      generateReportPdfBtn.disabled = false;
      generateReportPdfBtn.textContent = "Gerar PDF";
      renderAdmin();
    }
  };
  const clientSelect = document.getElementById("clientSelect");
  if (clientSelect) clientSelect.onchange = async (e) => {
    state.selectedClientId = e.target.value;
    await loadMonthsFor(state.selectedClientId, true);
    render();
  };
}

function pctChange(before, after){
  if (!before) return after ? "novo" : null;
  const d = ((after-before)/before)*100;
  return (d>=0?"+":"") + Math.round(d) + "%";
}

async function urlToDataUrl(url){
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (e) { return null; }
}

async function generateReportPdf(client, month, report){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const pageW = 595, pageH = 842, margin = 48, contentW = pageW - margin*2;
  const cyan = [14,165,183], ink = [15,23,42], inkSoft = [100,116,139], grid = [226,232,240], surface2=[248,250,252];
  let y = margin;

  function newPageIfNeeded(extra){
    if (y + extra > pageH - 64){ doc.addPage(); y = margin; }
  }

  function sectionHeader(title, color){
    newPageIfNeeded(30);
    doc.setFillColor(...(color||ink));
    doc.rect(margin, y, contentW, 24, "F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text(title, margin + contentW/2, y + 16, { align:"center" });
    y += 24 + 12;
  }

  function sectionTitle(title){
    newPageIfNeeded(24);
    doc.setFont("helvetica","bold"); doc.setFontSize(13);
    doc.setTextColor(...ink);
    doc.text(title, margin, y);
    y += 18;
  }

  function bodyText(text){
    const lines = doc.splitTextToSize(text || "—", contentW);
    newPageIfNeeded(lines.length*13+6);
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.setTextColor(...ink);
    doc.text(lines, margin, y);
    y += lines.length*13 + 10;
  }

  // cards: [{num, label, sub}], cardW auto
  function statCards(cards){
    const gap = 8, cardW = (contentW - gap*(cards.length-1))/cards.length, cardH = 54;
    newPageIfNeeded(cardH+10);
    cards.forEach((c,i) => {
      const cx = margin + i*(cardW+gap);
      doc.setFillColor(...surface2); doc.setDrawColor(...grid); doc.setLineWidth(0.75);
      doc.roundedRect(cx, y, cardW, cardH, 3, 3, "FD");
      doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(...ink);
      doc.text(String(c.num), cx+cardW/2, y+22, { align:"center" });
      doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...inkSoft);
      doc.text(c.label, cx+cardW/2, y+34, { align:"center", maxWidth: cardW-8 });
      if (c.sub){
        doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(...cyan);
        doc.text(c.sub, cx+cardW/2, y+45, { align:"center" });
      }
    });
    y += cardH + 14;
  }

  // gráfico simples de barras antes/agora para até 3 pares lado a lado
  function barPairs(pairs){
    const chartH = 90, gap = 16;
    const colW = (contentW - gap*(pairs.length-1)) / pairs.length;
    newPageIfNeeded(chartH + 36);
    const topY = y;
    pairs.forEach((p, i) => {
      const cx = margin + i*(colW+gap);
      doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...ink);
      doc.text(p.label, cx+colW/2, topY, { align:"center" });
      const maxV = Math.max(p.before, p.after, 1);
      const barAreaY = topY + 14, barAreaH = chartH - 14;
      const barW = colW/2 - 10;
      const hBefore = Math.max((p.before/maxV)*barAreaH, 2);
      const hAfter = Math.max((p.after/maxV)*barAreaH, 2);
      doc.setFillColor(...grid);
      doc.rect(cx+8, barAreaY+barAreaH-hBefore, barW, hBefore, "F");
      doc.setFillColor(...cyan);
      doc.rect(cx+8+barW+8, barAreaY+barAreaH-hAfter, barW, hAfter, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...ink);
      doc.text(fmtNum(p.before), cx+8+barW/2, barAreaY+barAreaH-hBefore-4, { align:"center" });
      doc.text(fmtNum(p.after), cx+8+barW+8+barW/2, barAreaY+barAreaH-hAfter-4, { align:"center" });
      doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(...inkSoft);
      doc.text("Antes", cx+8+barW/2, barAreaY+barAreaH+10, { align:"center" });
      doc.text("Agora", cx+8+barW+8+barW/2, barAreaY+barAreaH+10, { align:"center" });
    });
    y = topY + chartH + 24;
  }

  function fmtNum(n){
    n = n||0;
    if (n>=1000) return (n/1000).toFixed(1).replace(".0","")+" mil";
    return String(n);
  }

  // ---------------- CABEÇALHO ----------------
  try { doc.addImage(LOGO_DATA_URI, "PNG", margin, y, 110, 41); } catch(e) {}
  doc.setTextColor(...ink);
  doc.setFont("helvetica","bold"); doc.setFontSize(17);
  doc.text("Relatório de Resultados", margin + 125, y + 18);
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  doc.setTextColor(...inkSoft);
  doc.text(`Cliente: ${client.name}  ·  Período: ${month.month_label}`, margin + 125, y + 35);
  y += 58;
  doc.setDrawColor(...cyan); doc.setLineWidth(1.4);
  doc.line(margin, y, pageW-margin, y);
  y += 20;

  // ---------------- RESUMO DO MÊS ----------------
  sectionTitle("Resumo do mês");
  bodyText(month.admin_summary);

  // ---------------- PRIMEIRO CICLO (se status = implementação) ----------------
  if (client.process_status === "implementacao" || !client.process_status){
    sectionTitle("Primeiro ciclo de 30 dias");
    const weekNum = client.process_week || 1;
    doc.setFillColor(...cyan);
    doc.rect(margin, y, 64, 16, "F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
    doc.text("SEMANA " + weekNum, margin+32, y+11, { align:"center" });
    doc.setTextColor(...ink); doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    const wLines = doc.splitTextToSize(PROCESS_WEEKS[weekNum].replace(/^Semana \d — /,""), contentW-80);
    doc.text(wLines, margin+74, y+11);
    y += Math.max(16, wLines.length*12) + 16;
  }

  // ---------------- ENTREGÁVEIS DO MÊS ----------------
  sectionTitle("Entregáveis do mês");
  if (!state.checklist.length){
    bodyText("Nenhum item cadastrado para este mês.");
  } else {
    state.checklist.forEach(it => {
      newPageIfNeeded(14);
      doc.setFillColor(...cyan);
      doc.rect(margin, y-7, 6, 6, "F");
      doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...ink);
      const lines = doc.splitTextToSize(it.title, contentW-16);
      doc.text(lines, margin+14, y);
      y += lines.length*13 + 4;
    });
    y += 8;
  }

  // ---------------- PRINT DO SITE (opcional) ----------------
  if (client.site_screenshot_url){
    const dataUrl = await urlToDataUrl(client.site_screenshot_url);
    if (dataUrl){
      try {
        const imgProps = doc.getImageProperties(dataUrl);
        const imgW = contentW, imgH = Math.min(contentW * (imgProps.height/imgProps.width), 260);
        newPageIfNeeded(imgH + 24);
        doc.setDrawColor(...grid); doc.setLineWidth(0.75);
        doc.addImage(dataUrl, imgProps.fileType || "PNG", margin, y, imgW, imgH);
        doc.rect(margin, y, imgW, imgH, "D");
        y += imgH + 8;
        doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...inkSoft);
        doc.text(`Site criado para o cliente${client.site_url ? " — " + client.site_url : ""}`, margin, y);
        y += 20;
      } catch(e) {}
    }
  }

  // ---------------- CONTEÚDO PRODUZIDO x META ----------------
  sectionTitle("Conteúdo produzido no mês (feito / meta)");
  statCards([
    { num: `${month.posts_done||0}/${month.posts_target||0}`, label: "Posts" },
    { num: `${month.stories_done||0}/${month.stories_target||0}`, label: "Stories" },
    { num: `${month.reels_done||0}/${month.reels_target||0}`, label: "Reels" },
    { num: `${month.linkedin_done||0}/${month.linkedin_target||0}`, label: "Posts LinkedIn" },
  ]);

  // ---------------- MÉTRICAS POR CANAL ----------------
  const platformColors = { instagram: ink, facebook: [24,119,242], linkedin: [10,102,194] };
  // cada canal destaca as métricas que fazem sentido pra ele
  const PLATFORM_METRICS = {
    instagram: [["views","Visualizações"],["profile_visits","Visitas ao perfil"],["interactions","Interações"],["new_followers","Novos seguidores"]],
    facebook: [["views","Visualizações"],["interactions","Engajamento"],["reactions","Reações"],["shares","Compartilhamentos"]],
    linkedin: [["impressions","Impressões"],["new_followers","Novos seguidores"],["profile_visits","Visitas ao perfil"],["search_appearances","Aparições em pesquisas"]],
  };
  SOCIAL_PLATFORMS.forEach(([key,label]) => {
    const cur = state.socialInsights[key];
    const prev = state.prevSocialInsights ? state.prevSocialInsights[key] : null;
    if (!cur) return;
    sectionHeader(label.toUpperCase(), platformColors[key]);
    const metrics = PLATFORM_METRICS[key];
    statCards(metrics.map(([field,lbl]) => ({
      num: fmtNum(cur[field]), label: lbl, sub: prev ? pctChange(prev[field], cur[field]) : null
    })));
    // Gráfico de barras antes/agora só no Instagram — Facebook e LinkedIn
    // ficam só com os cartões, igual ao modelo de relatório combinado.
    if (key === "instagram"){
      if (prev){
        barPairs(metrics.slice(0,3).map(([field,lbl]) => ({ label: lbl, before: prev[field]||0, after: cur[field]||0 })));
      } else {
        bodyText("Sem dados do mês anterior para comparação.");
      }
    }
    if (cur.note) bodyText(cur.note);
  });

  // ---------------- PARA O PRÓXIMO MÊS ----------------
  sectionTitle("Para o próximo mês");
  bodyText(report && report.proximo_mes ? report.proximo_mes : "Não preenchido.");

  // ---------------- OBSERVAÇÃO + LINKS ----------------
  newPageIfNeeded(50);
  doc.setDrawColor(...grid); doc.setLineWidth(0.75);
  doc.line(margin, y, pageW-margin, y); y += 14;
  const obs = (state.proposal && state.proposal.observacao_metricas) ? state.proposal.observacao_metricas :
    "As métricas apresentadas refletem o desempenho orgânico das redes e não garantem resultados futuros.";
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...inkSoft);
  const obsLines = doc.splitTextToSize(obs, contentW);
  doc.text(obsLines, margin, y); y += obsLines.length*11 + 10;

  const linkDefs = [["Instagram",client.instagram_url],["Facebook",client.facebook_url],["LinkedIn",client.linkedin_url],["Site",client.site_url]].filter(([,u])=>u);
  if (linkDefs.length){
    let lx = margin;
    doc.setFont("helvetica","bold"); doc.setFontSize(9);
    linkDefs.forEach(([label,url], i) => {
      doc.setTextColor(...cyan);
      doc.textWithLink(label, lx, y, { url });
      lx += doc.getTextWidth(label) + 6;
      if (i < linkDefs.length-1){
        doc.setTextColor(...inkSoft);
        doc.text("·", lx, y);
        lx += doc.getTextWidth("·") + 6;
      }
    });
    y += 16;
  }

  const totalPages = doc.internal.getNumberOfPages();
  for (let i=1; i<=totalPages; i++){
    doc.setPage(i);
    doc.setFont("helvetica","normal"); doc.setFontSize(8);
    doc.setTextColor(...inkSoft);
    doc.text(`Defin Digital · gerado em ${new Date().toLocaleDateString("pt-BR")}`, margin, pageH - 32);
    doc.text(`${i}/${totalPages}`, pageW - margin - 20, pageH - 32);
  }

  doc.save(`relatorio-${client.name.replace(/\s+/g,"-").toLowerCase()}-${month.month_label}.pdf`);
}

function bindProcessStatusHandlers(client){
  if (!client) return;
  const statusSel = document.getElementById("processStatusSelect");
  if (statusSel) statusSel.onchange = async () => {
    const value = statusSel.value;
    client.process_status = value;
    await sb.from("clients").update({ process_status:value }).eq("id", client.id);
    renderAdmin();
  };
  const weekSel = document.getElementById("processWeekSelect");
  if (weekSel) weekSel.onchange = async () => {
    const value = Number(weekSel.value);
    client.process_week = value;
    await sb.from("clients").update({ process_week:value }).eq("id", client.id);
    renderAdmin();
  };
}

function bindCommon(isAdmin){
  document.getElementById("logoutBtn").onclick = () => sb.auth.signOut();
  const backToHubBtn = document.getElementById("backToHubBtn");
  if (backToHubBtn) backToHubBtn.onclick = () => { state.adminView = "hub"; render(); };
  document.querySelectorAll("[data-month]").forEach(btn => {
    btn.onclick = async () => {
      const month = state.months.find(m => m.id === btn.dataset.month);
      state.selectedMonth = month;
      await loadCalendar(month.id);
      await loadSocialInsights(month.id);
      await loadChecklist(month.id);
      await loadMonthlyReport(month.id);
      await loadMetaAdsData(month.id);
      await loadGmnData(month.id);
      await loadPreviousMonthData(state.selectedClientId, month);
      if (isAdmin) await ensureSocialInsightRows(month.id, state.selectedClientId);
      render();
    };
  });
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });
  document.querySelectorAll("[data-admintab]").forEach(btn => {
    btn.onclick = () => { state.adminTab = btn.dataset.admintab; render(); };
  });
}

init();
